document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

*/\n@font-face {\n  font-family: 'Fredoka';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"4789d526-fd58-4d60-b08d-fc7e59067105\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Fredoka';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"46066f4d-b048-4eb7-909b-c4fdd1759603\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Fredoka';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"e81bb906-c2d6-4be8-a8bf-ebc1bb1e0bd2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;height:100%}\nbody{background:#0b0718;background-image:radial-gradient(120% 90% at 50% -10%,#2a1550 0%,#160c30 45%,#0b0718 100%);background-attachment:fixed;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Fredoka',system-ui,sans-serif}\na{color:#7fd7ff}a:hover{color:#b8e9ff}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-screen-label=\"Game\" style=\"height:100dvh;display:flex;flex-direction:column;align-items:center;color:#e9e4ff\">\n  <div style=\"width:100%;max-width:680px;padding:14px 16px 4px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n      <div style=\"font-weight:700;font-size:clamp(20px,4.5vw,27px);letter-spacing:3px;background:linear-gradient(180deg,#ffe9a3,#ffb84d 60%,#ff8f3d);-webkit-background-clip:text;background-clip:text;color:transparent\">GEM CASCADE<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onHint }}\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#e9e4ff;font-family:inherit;font-weight:600;font-size:12px;letter-spacing:1.5px;padding:10px 16px;border-radius:999px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.15)\" style-active=\"transform:scale(.95)\">HINT<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onSound }}\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#e9e4ff;font-family:inherit;font-weight:600;font-size:12px;letter-spacing:1.5px;padding:10px 16px;border-radius:999px;cursor:pointer;min-width:78px\" style-hover=\"background:rgba(255,255,255,.15)\" style-active=\"transform:scale(.95)\">{{ soundLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onNew }}\" style=\"background:rgba(255,184,77,.12);border:1px solid rgba(255,184,77,.4);color:#ffd257;font-family:inherit;font-weight:600;font-size:12px;letter-spacing:1.5px;padding:10px 16px;border-radius:999px;cursor:pointer\" style-hover=\"background:rgba(255,184,77,.22)\" style-active=\"transform:scale(.95)\">NEW<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:stretch;gap:10px;flex-wrap:wrap\">\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 16px;display:flex;flex-direction:column;gap:2px;min-width:104px;box-sizing:border-box\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:rgba(233,228,255,.55);font-weight:600\">SCORE<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;color:#ffd257;font-variant-numeric:tabular-nums;line-height:1.05\">{{ score }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 16px;display:flex;flex-direction:column;gap:2px;min-width:88px;box-sizing:border-box\">\n        <div style=\"font-size:10px;letter-spacing:2px;color:rgba(233,228,255,.55);font-weight:600\">BEST<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:600;color:rgba(233,228,255,.9);font-variant-numeric:tabular-nums;line-height:1.05\">{{ best }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:180px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:10px;box-sizing:border-box\">\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:1px;color:#7fd7ff;white-space:nowrap\">LVL {{ level }}<\u002Fdiv>\n        <div style=\"flex:1;height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)\">\n          <div style=\"height:100%;width:{{ barW }};border-radius:999px;background:linear-gradient(90deg,#3ee0ff,#a06bff);box-shadow:0 0 10px rgba(130,150,255,.8);transition:width .35s ease\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div ref=\"{{ wrapRef }}\" style=\"flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:10px 12px 16px;box-sizing:border-box\">\n    <canvas ref=\"{{ canvasRef }}\" sc-camel-on-pointer-down=\"{{ onPD }}\" sc-camel-on-pointer-move=\"{{ onPM }}\" sc-camel-on-pointer-up=\"{{ onPU }}\" sc-camel-on-pointer-cancel=\"{{ onPC }}\" style=\"touch-action:none;display:block;border-radius:18px\"><\u002Fcanvas>\n  <\u002Fdiv>\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;boardSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:6,&quot;max&quot;:10,&quot;section&quot;:&quot;Gameplay&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;gemTypes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:5,&quot;max&quot;:8,&quot;section&quot;:&quot;Gameplay&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;particles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Effects&quot;,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst KEY='gem-cascade-save-v2';\nconst P=['#ff3b5c','#ff9330','#ffd42a','#3ad463','#2fb4ff','#b465ff','#e9edf7','#ff5fd0'];\nfunction mix(hex,to,k){const h=(s)=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const a=h(hex),b=h(to);const m=a.map((v,i)=>Math.round(v+(b[i]-v)*k));return 'rgb('+m.join(',')+')';}\nfunction rgba(hex,a){const h=(s)=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const c=h(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}\nfunction rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}\nfunction poly(x,R,k,rot){x.beginPath();for(let i=0;i<k;i++){const a=rot+i*2*Math.PI/k;i?x.lineTo(Math.cos(a)*R,Math.sin(a)*R):x.moveTo(Math.cos(a)*R,Math.sin(a)*R);}x.closePath();}\nconst SH=[\n (x,R)=>rr(x,-R*.85,-R*.85,R*1.7,R*1.7,R*.4),\n (x,R)=>poly(x,R,5,-Math.PI/2),\n (x,R)=>{x.beginPath();x.moveTo(0,-R*1.05);x.lineTo(R*.8,0);x.lineTo(0,R*1.05);x.lineTo(-R*.8,0);x.closePath();},\n (x,R)=>poly(x,R*.95,6,0),\n (x,R)=>{x.beginPath();x.arc(0,0,R*.92,0,7);},\n (x,R)=>poly(x,R,3,-Math.PI/2),\n (x,R)=>{x.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4;const rad=i%2?R*.62:R*1.02;i?x.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):x.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);}x.closePath();},\n (x,R)=>poly(x,R*.95,8,Math.PI/8)\n];\nconst NOTES=[523,587,659,784,880,988,1047,1175];\n\nclass Component extends DCLogic {\n  state={score:0,best:0,level:1,barW:'0%',soundOn:true};\n  canvasRef=React.createRef();\n  wrapRef=React.createRef();\n\n  renderVals(){\n    return {\n      score:this.state.score.toLocaleString(), best:this.state.best.toLocaleString(),\n      level:this.state.level, barW:this.state.barW,\n      soundLabel:this.state.soundOn?'\\u266A ON':'\\u266A OFF',\n      onHint:()=>this.forceHint(), onNew:()=>this.newGame(true), onSound:()=>this.toggleSound(),\n      onPD:(e)=>this.pDown(e), onPM:(e)=>this.pMove(e), onPU:(e)=>this.pUp(e), onPC:()=>{this.ptr=null;},\n      canvasRef:this.canvasRef, wrapRef:this.wrapRef\n    };\n  }\n\n  applyDims(){const cl=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v||a)));this.n=cl(this.props.boardSize??8,6,10);this.types=cl(this.props.gemTypes??7,5,8);}\n  X(c){return this.pad+c*this.S;}\n  Y(r){return this.pad+r*this.S;}\n\n  componentDidMount(){\n    this.applyDims();\n    this.score=0;this.best=0;this.level=1;this.levelScore=0;this.cascade=1;this.muted=false;\n    this.parts=[];this.pops=[];this.banner=null;this.toastO=null;this.sel=null;this.hint=null;this.idleT=0;\n    this.gScale=1;this.phase='idle';this.phaseT=0;this.lastLand=0;this.S=0;this.pad=0;this.B=0;this.dt=0;this.ptr=null;\n    this.cv=this.canvasRef.current; if(!this.cv) return;\n    this.cx=this.cv.getContext('2d');\n    if(!this.load()){this.gen();this.setToast('SWAP ADJACENT GEMS TO MATCH 3+',3.5);}\n    this.syncHud();\n    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(this.wrapRef.current);\n    this.resize();\n    this.unlock=()=>{this.audio();};\n    window.addEventListener('pointerdown',this.unlock,{once:true});\n    this.onHide=()=>{if(this.phase==='idle')this.saveGame();};\n    window.addEventListener('pagehide',this.onHide);\n    this.last=performance.now();\n    this.raf=requestAnimationFrame((t)=>this.tick(t));\n  }\n  componentDidUpdate(pp){\n    if((pp.boardSize??8)!==(this.props.boardSize??8)||(pp.gemTypes??7)!==(this.props.gemTypes??7)){\n      this.applyDims();this.newGame(false);this. me(v,t0+0.012);g.gain.exponentialRampToValueAtTime(0.001,t0+d);\n    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+d+.05);\n  }\n  noiseS(d,v,fc){\n    const ac=this.audio();if(!ac||this.muted)return;\n    const len=Math.max(1,(ac.sampleRate*d)|0);const buf=ac.createBuffer(1,len,ac.sampleRate);\n    const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;\n    const src=ac.createBufferSource();src.buffer=buf;\n    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=.8;\n    const g=ac.createGain();const t0=ac.currentTime;\n    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);\n    src.connect(f);f.connect(g);g.connect(this.master);src.start(t0);\n  }\n  snd(name){\n    if(this.muted)return;\n    switch(name){\n      case 'select':this.tone(520,660,.07,'triangle',.14);break;\n      case 'swap':this.tone(300,520,.09,'sine',.16);break;\n      case 'bad':this.tone(180,110,.18,'sawtooth',.1);break;\n      case 'land':this.tone(200,150,.05,'sine',.07);break;\n      case 'match':{const nn=NOTES[Math.min(7,this.cascade-1)];this.tone(nn,nn,.14,'triangle',.2);this.tone(nn*2,nn*2,.08,'sine',.07,.02);break;}\n      case 'boom':this.noiseS(.3,.3,240);this.tone(120,50,.28,'sine',.3);break;\n      case 'zap':this.noiseS(.16,.25,2800);this.tone(1500,300,.16,'square',.09);break;\n      case 'cube':this.tone(220,1500,.4,'sine',.2);this.tone(330,2200,.4,'triangle',.1);break;\n      case 'level':[523,659,784,1047].forEach((f,i)=>this.tone(f,f,.16,'triangle',.18,i*.09));break;\n      case 'shuffle':for(let i=0;i<5;i++)this.tone(280+Math.random()*380,400,.05,'triangle',.08,i*.05);break;\n    }\n  }\n\n  // ---------- fx ----------\n  burst(x,y,colorIdx,count,power){\n    if((this.props.particles??true)===false)return;\n    if(this.parts.length>420)return;\n    for(let i=0;i<count;i++){\n      const a=Math.random()*Math.PI*2,sp=this.S*(1.5+Math.random()*3.5)*(power||1)*.6;\n      this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-this.S*1.5,life:.5+Math.random()*.4,t:0,\n        col:colorIdx>=0?P[colorIdx]:'hsl('+((Math.random()*360)|0)+',90%,65%)',sz:this.S*(.05+Math.random()*.09),rot:Math.random()*6,vr:(Math.random()-.5)*12});\n    }\n  }\n  pop(x,y,txt,col){this.pops.push({x,y,txt,col,t:0,dur:.95});}\n\n  // ---------- loop ----------\n  tick(t){\n    this.raf=requestAnimationFrame((tt)=>this.tick(tt));\n    const dt=Math.min(.05,Math.max(0,(t-this.last)/1000));this.last=t;this.dt=dt;\n    if(!this.G||!this.S)return;\n    this.update(dt);\n    this.draw(t/1000);\n  }\n  updateTweens(dt){\n    let any=false;\n    this.eachGem(g=>{\n      if(!g.tw)return;any=true;\n      g.tw.t+=dt*1000;const p=Math.min(1,g.tw.t/g.tw.d);const e=1-(1-p)*(1-p);\n      g.px=g.tw.x0+(this.X(g.tw.tc)-g.tw.x0)*e;\n      g.py=g.tw.y0+(this.Y(g.tw.tr)-g.tw.y0)*e;\n      if(p>=1){g.px=this.X(g.tw.tc);g.py=this.Y(g.tw.tr);g.tw=null;}\n    });\n    return any;\n  }\n  update(dt){\n    const anyTw=this.updateTweens(dt);\n    switch(this.phase){\n      case 'idle':\n        this.idleT+=dt*1000;\n        if(this.idleT>7000&&!this.hint){this.showHint();this.idleT=0;}\n        break;\n      case 'swapping':\n        if(!anyTw){this.swapGrid(this.swapMeta.a,this.swapMeta.b);this.evaluate();}\n        break;\n      case 'swapback':\n        if(!anyTw){this.phase='idle';this.phaseT=0;}\n        break;\n      case 'clearing':\n        if(this.phaseT>=230)this.afterClear();\n        break;\n      case 'falling':\n        this.updateFall(dt);\n        if(!this.anyFalling()&&!anyTw)this.waveDone();\n        break;\n      case 'shufOut':\n        this.gScale=Math.max(0,1-this.phaseT/200);\n        if(this.phaseT>=200){this.doReshuffle();this.phase='shufIn';this.phaseT=0;}\n        break;\n      case 'shufIn':\n        this.gScale=Math.min(1,this.phaseT/200);\n        if(this.phaseT>=200){this.gScale=1;this.phase='idle';this.phaseT=0;this.saveGame();}\n        break;\n    }\n    this.phaseT+=dt*1 ],'#ffffff',.45));g.addColorStop(.55,P[i]);g.addColorStop(1,mix(P[i],'#000000',.52));\n      x.fillStyle=g;x.strokeStyle=g;x.lineWidth=R*.3;\n      SH[i](x,R*.86);x.fill();x.stroke();\n      x.save();x.scale(.86,.86);SH[i](x,R*.86);x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=R*.07;x.stroke();x.restore();\n      x.save();SH[i](x,R*.86);x.clip();\n      const bl=x.createRadialGradient(0,R*.62,R*.05,0,R*.62,R*.75);\n      bl.addColorStop(0,'rgba(255,255,255,.3)');bl.addColorStop(1,'rgba(255,255,255,0)');\n      x.fillStyle=bl;x.fillRect(-R,0,R*2,R*1.2);\n      x.rotate(-.6);\n      x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.ellipse(-R*.1,-R*.44,R*.56,R*.24,0,0,7);x.fill();\n      x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(-R*.18,-R*.5,R*.3,R*.12,0,0,7);x.fill();\n      x.restore();\n      x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(-R*.34,-R*.56,Math.max(1.4,S*.032),0,7);x.fill();\n      x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(R*.3,R*.35,Math.max(1,S*.018),0,7);x.fill();\n      this.spr[i]=cv;\n    }\n    const mkGlow=(col)=>{const cv=document.createElement('canvas');const D=S*2;cv.width=cv.height=D;\n      const x=cv.getContext('2d');const g=x.createRadialGradient(D/2,D/2,2,D/2,D/2,D/2);\n      g.addColorStop(0,rgba(col,.85));g.addColorStop(.4,rgba(col,.35));g.addColorStop(1,rgba(col,0));\n      x.fillStyle=g;x.fillRect(0,0,D,D);return cv;};\n    this.gloW=mkGlow('#ffffff');this.gloF=mkGlow('#ffb14d');\n    this.gloC=P.map(cc=>mkGlow(cc));\n  }\n  drawCube(x,t){\n    const R=this.S*.34;\n    const g=x.createRadialGradient(-R*.3,-R*.4,R*.1,0,0,R);\n    g.addColorStop(0,'#4a3a75');g.addColorStop(.6,'#221743');g.addColorStop(1,'#0a0618');\n    x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();\n    for(let k=0;k<6;k++){\n      const hue=(k*60+t*90)%360;\n      x.strokeStyle='hsla('+hue+',95%,62%,.9)';x.lineWidth=this.S*.06;\n      x.beginPath();x.arc(0,0,R*.72,t*1.6+k*Math.PI/3,t*1.6+k*Math.PI/3+.42);x.stroke( =(g.dead?1-clearP:1)*ga;x.drawImage(this.gloW,-S*.9,-S*.9,S*1.8,S*1.8);x.restore();}\n      if(g.s==='C'&&this.gloW){x.save();x.globalAlpha=(g.dead?1-clearP:1)*.35;x.drawImage(this.gloW,-S*.95,-S*.95,S*1.9,S*1.9);x.restore();}\n      x.scale(sc,sy);\n      if(g.s==='C')this.drawCube(x,t);\n      else if(this.spr&&this.spr[g.c]){\n        x.drawImage(this.spr[g.c],-S/2,-S/2,S,S);\n        const cyc=(t*.45+((r*13+c*7)%9)*.37)%3.4;\n        if(cyc<.38&&!g.dead){\n          const q=cyc/.38;\n          x.save();SH[g.c](x,S*.31);x.clip();x.rotate(-.7);\n          const sx=-S*.8+q*S*1.6;\n          const gr=x.createLinearGradient(sx-S*.16,0,sx+S*.16,0);\n          gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');\n          x.fillStyle=gr;x.fillRect(sx-S*.16,-S*.8,S*.32,S*1.6);\n          x.restore();\n        }\n        if(g.s==='L'){\n          const la=.5+.35*Math.sin(t*8);\n          x.fillStyle='rgba(255,255,255,'+la+')';\n          rr(x,-S*.36,-S*.05,S*.72,S*.1,S*.05);x.fill();\n          rr(x,-S*.05,-S*.36,S*.1,S*.72,S*.05);x.fill();\n        }\n        if(g.s==='F'){x.fillStyle='rgba(255,235,180,'+(.35+.25*Math.sin(t*7))+')';x.beginPath();x.arc(0,0,S*.12,0,7);x.fill();}\n      }\n      if(g.dead&&clearP>0){x.globalAlpha=(1-clearP)*.7;x.fillStyle='#fff';x.beginPath();x.arc(0,0,S*.4*clearP+S*.1,0,7);x.fill();}\n      x.restore();\n    }\n    if(this.sel){\n      const pu=1+.04*Math.sin(t*6);\n      const w=S*pu,off=(S-w)/2;\n      x.save();x.shadowColor='rgba(255,255,255,.9)';x.shadowBlur=12;\n      x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=3;\n      rr(x,this.X(this.sel.c)+off+1,this.Y(this.sel.r)+off+1,w-2,w-2,S*.18);x.stroke();\n      x.restore();\n    }\n    for(const p of this.parts){\n      x.save();x.globalAlpha=Math.max(0,1-p.t/p.life);\n      x.translate(p.x,p.y);x.rotate(p.rot);\n      x.fillStyle=p.col;x.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);\n      x.restore();\n    }\n    x   </script>

<script>
/* Hub integration overlay. The bundler replaceWith()s the DOM on unpack, so a
   static #version-badge would be wiped; re-assert it here (the interval lives
   on window and survives the replacement, like the bundler's own error sink). */
(function () {
  function ensure() {
    if (document.body && !document.getElementById("version-badge")) {
      var badge = document.createElement("div");
      badge.id = "version-badge";
      badge.title = "Version";
      badge.style.cssText = "position:fixed;right:8px;bottom:6px;z-index:2147483647;font:600 11px/1 system-ui,-apple-system,sans-serif;color:#8a8f9c;opacity:.5;pointer-events:none";
      var a = document.createElement('a');
      a.href = 'https://github.com/freaxnx01/game-gem-cascade/blob/main/CHANGELOG.md';
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = 'Changelog';
      a.textContent = 'v' + (window.GAME_VERSION || '0.0.0');
      a.style.color = 'inherit';
      a.style.textDecoration = 'none';
      badge.appendChild(a);
      document.body.appendChild(badge);
    }
  }
  var n = 0, iv = setInterval(function () { ensure(); if (++n > 40) clearInterval(iv); }, 250);
  document.addEventListener("DOMContentLoaded", ensure);
  window.addEventListener("load", ensure);
})();
</script>
</body>
